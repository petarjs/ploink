<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' data:" />
  <title>Ploink</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="booting">
  <div class="chassis">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-word">PLOINK</span>
        <span class="brand-model">DC&#8209;01 · DEPLOY CONSOLE</span>
      </div>
      <div class="topbar-right">
        <div class="usage-lamps" id="usage-lamps"></div>
        <button class="lamp" id="lamp-agent" title="MCP server for agents">
          <i class="lamp-dot"></i><span>AGENT LINK</span>
        </button>
        <div class="lamp" id="lamp-active" title="Deploys in progress">
          <i class="lamp-dot"></i><span id="lamp-active-label">IDLE</span>
        </div>
        <div class="divider"></div>
        <button class="rocker" id="sound-toggle" role="switch" aria-checked="true" title="Sound">
          <span class="rocker-track"><span class="rocker-nub"></span></span>
          <span class="rocker-label">SND</span>
        </button>
        <button class="keycap small" id="btn-log" title="Flight log (⌘L)" aria-label="Activity log">
          <svg viewBox="0 0 16 16" width="15" height="15"><path d="M3.5 1.8h9v12.4l-1.5-1-1.5 1-1.5-1-1.5 1-1.5-1-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5.6 5h4.8M5.6 7.6h4.8M5.6 10.2h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <i class="log-dot"></i>
        </button>
        <button class="keycap small" id="btn-add" title="Add project (⌘N)" aria-label="Add project">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="keycap small" id="btn-settings" title="Settings (⌘,)" aria-label="Settings">
          <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.8v1.8M8 12.4v1.8M14.2 8h-1.8M3.6 8H1.8M12.4 3.6l-1.3 1.3M4.9 11.1l-1.3 1.3M12.4 12.4l-1.3-1.3M4.9 4.9L3.6 3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main class="deck-scroll" id="deck-scroll">
      <section class="deck" id="deck" aria-label="Projects"></section>
    </main>

    <footer class="strip">
      <span class="strip-item"><b class="strip-key">HOLD</b> button to launch</span>
      <span class="strip-item"><b class="strip-key">1–9</b> hold to launch bay</span>
      <span class="strip-item"><b class="strip-key" id="strip-shortcut">F5</b> summon</span>
      <span class="strip-spacer"></span>
      <span class="strip-item mono" id="strip-mcp">MCP OFFLINE</span>
    </footer>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="drop-veil" aria-hidden="true"><div class="drop-veil-inner"><div class="drop-socket"></div><div>Release to install</div></div></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <aside class="flightlog" id="flightlog" aria-hidden="true" aria-label="Activity log"></aside>
  <div class="modal-root" id="modal-root"></div>
  <div class="toast-root" id="toast-root"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
